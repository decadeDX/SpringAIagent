spring:
  application:
    name: SpringAIagent
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lab_agent}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 3
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      client-type: jedis
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-5-mini}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:none}
      redis:
        index-name: lab-knowledge-index
        prefix: lab-knowledge:
        initialize-schema: ${KNOWLEDGE_RAG_ENABLED:false}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml

knowledge:
  rag-enabled: ${KNOWLEDGE_RAG_ENABLED:false}
  storage-path: ${KNOWLEDGE_STORAGE_PATH:knowledge/uploads}
  cache-ttl: PT10M

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: lab-assistant
    ttl: PT2H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
