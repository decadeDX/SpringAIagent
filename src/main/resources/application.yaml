spring:
  config:
    # 本地从 IDE 启动时也读取 Docker Compose 使用的私有环境变量；生产环境仍可仅通过系统环境变量覆盖。
    import: optional:file:deploy/.env[.properties]
  autoconfigure:
    # 默认 Redis Vector Store 不会声明 documentId 过滤字段，改由 KnowledgeInfrastructureConfig 显式创建。
    exclude: org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  application:
    name: SpringAIagent
  jackson:
    datatype:
      datetime:
        adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lab_agent}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 3
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      client-type: jedis
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:}
        max-completion-tokens: ${OPENAI_CHAT_MAX_COMPLETION_TOKENS:4096}
      embedding:
        base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:}
        api-key: ${DASHSCOPE_API_KEY:}
        model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}
        dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1024}
    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:none}
      redis:
        index-name: lab-knowledge-index
        prefix: "lab-knowledge:"
        initialize-schema: ${KNOWLEDGE_RAG_ENABLED:false}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml

knowledge:
  rag-enabled: ${KNOWLEDGE_RAG_ENABLED:false}
  storage-path: ${KNOWLEDGE_STORAGE_PATH:knowledge/uploads}
  cache-ttl: PT10M

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: lab-assistant
    ttl: PT2H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
